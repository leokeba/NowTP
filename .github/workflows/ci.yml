name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests agree on the version
        run: python3 scripts/version.py
      - name: Build and run tests (ASan + UBSan)
        run: |
          cmake -S . -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  # size_t is 32 bits on the ESP32: a wrap of `chunk + kDataHeader` or similar
  # is invisible in a 64-bit host build, so run the same suite with -m32.
  host-tests-32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the 32-bit toolchain (multilib)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386
      - name: Build and run tests (ASan + UBSan, 32-bit size_t)
        run: |
          cmake -S . -B build-m32 -DCMAKE_CXX_FLAGS=-m32
          cmake --build build-m32 -j
          ctest --test-dir build-m32 --output-on-failure

  esp-idf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [release-v4.4, release-v5.1, release-v5.4, release-v5.5, latest]
        target: [esp32, esp32c3]
    steps:
      - uses: actions/checkout@v4
      - name: Build example
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/idf/reliable_echo
      - name: Build on-target test
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: test/hardware
      - name: Build two-board test
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: test/pair

  arduino:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ["2.0.17", "3.3.7"]
        fqbn: ["esp32:esp32:esp32", "esp32:esp32:esp32c3"]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: examples/arduino
          libraries: |
            - source-path: ./

  # A clang build of the libFuzzer harnesses (test/fuzz/README.md) and a
  # short run of fuzz_frames on the hand-written seeds, so a harness that
  # stops building, or a shallow crash, shows up on push.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the harnesses (clang, ASan + UBSan)
        run: |
          cmake -S . -B build \
                -DNOWTP_FUZZ=ON -DNOWTP_BUILD_TESTS=OFF \
                -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-O1
          cmake --build build -j
      - name: Fuzz for 60 s on the seeds
        run: |
          python3 test/fuzz/seeds.py build/seeds
          mkdir -p build/corpus
          ./build/test/fuzz/fuzz_frames -max_len=4096 -max_total_time=60 \
                build/corpus build/seeds/frames

  # Every push to main that passes becomes a release vX.Y.Z: a patch bump,
  # or more with a "Release: minor" or "Release: major" trailer in a commit
  # since the last tag. The version files are stamped in a commit only the
  # tag points at; main never gets one.
  release:
    needs: [host-tests, host-tests-32bit, esp-idf, arduino, fuzz-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    uses: leokeba/TesserKIT/.github/workflows/firmware.yml@main
    with:
      version-command: jq -r .version library.json  # the floor: the first release is v0.5.0
      stamp-command: python3 scripts/version.py "$VERSION"
