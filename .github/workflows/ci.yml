name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests agree on the version
        run: python3 scripts/version.py
      - name: Build and run tests (ASan + UBSan)
        run: |
          cmake -S . -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  esp-idf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [release-v4.4, release-v5.1, release-v5.4, release-v5.5, latest]
        target: [esp32, esp32c3]
    steps:
      - uses: actions/checkout@v4
      - name: Build example
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/idf/reliable_echo
      - name: Build on-target test
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: test/hardware
      - name: Build two-board test
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: test/pair

  arduino:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ["2.0.17", "3.3.7"]
        fqbn: ["esp32:esp32:esp32", "esp32:esp32:esp32c3"]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: examples/arduino
          libraries: |
            - source-path: ./

  # Every push to main that passes becomes a release vX.Y.Z: a patch bump,
  # or more with a "Release: minor" or "Release: major" trailer in a commit
  # since the last tag. The version files are stamped in a commit only the
  # tag points at; main never gets one.
  release:
    needs: [host-tests, esp-idf, arduino]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    uses: leokeba/TesserKIT/.github/workflows/firmware.yml@main
    with:
      version-command: jq -r .version library.json  # the floor: the first release is v0.5.0
      stamp-command: python3 scripts/version.py "$VERSION"
