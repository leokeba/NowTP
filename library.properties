sentence=Reliable, arbitrary-length messaging over ESP-NOW for Arduino and ESP-IDF.
paragraph=A small transport layer on top of ESP-NOW: messages larger than one frame, ports, optional reliable delivery with selective retransmission, latest-only streams, send pacing on the radio's send-complete callback, and bounded memory. Callbacks never run in the Wi-Fi driver task.
